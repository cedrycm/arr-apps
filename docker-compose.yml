---
services:
# DOCKHAND 

  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockhand_data:/app/data

# PROWLARR

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    hostname: prowlarr
    volumes:
      - /arr/prowlarr/config:/config
      - /arr/prowlarr/backup:/data/backup
      - ${MEDIA_PATH}/downloads:/downloads
    networks:
      - arr_internal
    ports:
      - 9696:9696
    restart: unless-stopped
    env_file:
      - '.env'

# RECYCLARR

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr
    container_name: recyclarr
    hostname: recyclarr
    networks:
      - arr_internal
    volumes:
      - /arr/recyclarr/config:/config
    restart: unless-stopped
    env_file:
      - '.env'

# SONARR

  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    hostname: sonarr
    volumes:
      - /arr/sonarr/config:/config
      - /arr/sonarr/backup:/data/backup
      - ${MEDIA_PATH}/tv:/data/tv
      - ${MEDIA_PATH}/anime/tv:/data/anime/tv
      - ${MEDIA_PATH}/downloads:/downloads
    networks:
      - arr_internal
    ports:
      - 8989:8989
    restart: unless-stopped
    env_file:
      - '.env'

# RADARR

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    hostname: radarr
    volumes:
      - /arr/radarr/config:/config
      - /arr/radarr/backup:/data/backup
      - ${MEDIA_PATH}/movies:/data/movies
      - ${MEDIA_PATH}/anime/movies:/data/anime/movies
      - ${MEDIA_PATH}/downloads:/downloads
    networks:
      - arr_internal
    ports:
      - 7878:7878
    restart: unless-stopped
    env_file:
      - '.env'

# LIDARR

  lidarr:
    image: linuxserver/lidarr:latest
    container_name: lidarr
    hostname: lidarr
    volumes:
      - /arr/lidarr/config:/config
      - ${MEDIA_PATH}/music:/data/musicfolder
      - ${MEDIA_PATH}/downloads:/downloads
    networks:
      - arr_internal
    ports:
      - 8686:8686
    restart: unless-stopped
    env_file:
      - '.env'

# CALIBRE-WEB-AUTOMATED

  calibre-web-automated:
    image: crocodilestick/calibre-web-automated:latest
    container_name: calibre-web-automated
    environment:
      # Only change these if you know what you're doing
      - PUID=568
      - PGID=568
      # Edit to match your current timezone https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      - TZ=America/Los_Angeles
      # Hardcover API Key required for Hardcover as a Metadata Provider, get one here: https://docs.hardcover.app/api/getting-started/
      - HARDCOVER_TOKEN=${HARDCOVER_API_KEY}
      # If your library is on a network share (e.g., NFS/SMB), disable WAL to reduce locking issues
      # Accepts: true/false (default: false)
      - NETWORK_SHARE_MODE=false
      # Override the default port (8083) for the web server.
      # Accepts any valid port number.
      - CWA_PORT_OVERRIDE=8083
      - TRUSTED_PROXY_COUNT=2
    volumes:
      # CW users migrating should stop their existing CW instance, make a copy of the config folder, and bind that here to carry over all of their user settings ect.
      - /arr/calibre-web-automated/config/:/config
      # This is an ingest dir, NOT a library one. Anything added here will be automatically added to your library according to the settings you have configured in CWA Settings page. All files placed here are REMOVED AFTER PROCESSING
      - ${MEDIA_PATH}/downloads/ebooks:/cwa-book-ingest
      # If you don't have an existing library, CWA will automatically create one at the bind provided here
      - ${MEDIA_PATH}/ebooks/library:/calibre-library
      # If you use calibre plugins, you can bind your plugins folder here to have CWA attempt to add them to its workflow (WIP)
      # If you are starting with a fresh install, you also need to copy customize.py.json to the Calibre config volume above, in /path/to/config/folder/.config/calibre/customize.py.json, see the note below for more info
      - ${MEDIA_PATH}/ebooks/calibre/plugins:/config/.config/calibre/plugins
    networks:
      - arr_internal
    ports:
      # Change the first number to change the port you want to access the Web UI, not the second
      - 8083:8083
    # If you set CWA_PORT_OVERRIDE to a port below 1024, you may need to uncomment the following line:
    # cap_add:
    #   - NET_BIND_SERVICE
    restart: unless-stopped
    env_file:
      - '.env'

# SHELFMARK (Book Downloader)

  shelfmark:
    image: ghcr.io/calibrain/calibre-web-automated-book-downloader:latest
    container_name: shelfmark
    hostname: shelfmark
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - FLASK_PORT=8084
      - INGEST_DIR=/books
    volumes:
      - /arr/shelfmark/config:/config
      - ${MEDIA_PATH}/downloads/ebooks:/books
    networks:
      - arr_internal
    ports:
      - 8084:8084
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8084/api/health"]
      interval: 30s
      timeout: 30s
      retries: 3
    restart: unless-stopped
    env_file:
      - '.env'


# HOMARR

  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Optional, only if you want docker integration
      - /arr/homarr/data:/appdata
    networks:
      - arr_internal
    environment:
      - SECRET_ENCRYPTION_KEY=${HOMARR_ENCRYPTION_KEY}
    ports:
      - '7575:7575'
# NZBGET

  nzbget:
    image: lscr.io/linuxserver/nzbget:latest
    container_name: nzbget
    volumes:
      - /nzb/config:/config
      - ${MEDIA_PATH}movies:/data/movies
      - ${MEDIA_PATH}anime/movies:/data/anime/movies
      - ${MEDIA_PATH}/tv:/data/tv
      - ${MEDIA_PATH}/anime/tv:/data/anime/tv
      - ${MEDIA_PATH}downloads:/downloads #optional
    networks:
      - arr_internal
    ports:
      - 6789:6789
    environment:
      - NZBGET_USER=nzbget #optional
      - NZBGET_PASS=tegbzn6789 #optional
    restart: unless-stopped
    env_file:
      - '.env'

# SUWAYOMI
  suwayomi_server:
    image: ghcr.io/suwayomi/suwayomi-server:stable
    container_name: Suwayomi-Server
    volumes: # The order matters! Make sure the downloads is first in the volume list or it will not work!
      - ${MEDIA_PATH}/ebooks/manga:/home/suwayomi/.local/share/Tachidesk
    networks:
      - arr_internal
    ports:
      - 4568:4567
    restart: unless-stopped

  qbittorrent:
     image: linuxserver/qbittorrent:latest
     container_name: qbittorrent
     hostname: qbittorrent
     restart: unless-stopped
     labels:
       - "com.centurylinklabs.watchtower.enable=false"
     volumes:
       - /qbittorrent/config:/config
       - ${MEDIA_PATH}downloads:/downloads
     networks:
       - arr_internal
     ports:
       - 8080:8080
       - 6881:6881
       - 6881:6881/udp
     environment:
       - WEBUI_PORT=8080
       - TORRENTING_PORT=6881
     healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
     env_file:
       - '.env'

networks:
  arr_internal:
    driver: bridge

volumes:
  dockhand_data:
